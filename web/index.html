<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget tells Chrome to shrink the viewport for the on-screen
         keyboard rather than pan the page, which keeps our layout math honest -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#F3EDE2" />
    <!-- lets the wall iPad launch fullscreen from the home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Household Hub" />
    <!-- Fonts are self-hosted (src/fonts.css). The CSP is 'self' only, so a
         Google Fonts link would be blocked -- and a wall tablet should render
         correctly without reaching the internet at all. -->
    <title>HouseHub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
